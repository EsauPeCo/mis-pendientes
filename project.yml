# Definición del proyecto de Xcode. En macOS: `xcodegen generate` crea MisPendientes.xcodeproj.
name: MisPendientes
options:
  bundleIdPrefix: io.github.esaupeco
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MisPendientes:
    type: application
    platform: iOS
    sources:
      - MisPendientes
    settings:
      base:
        PRODUCT_NAME: MisPendientes
        PRODUCT_BUNDLE_IDENTIFIER: io.github.esaupeco.mispendientes
        INFOPLIST_FILE: MisPendientes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  MisPendientesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MisPendientesTests
    dependencies:
      - target: MisPendientes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.esaupeco.mispendientes.tests
  MisPendientesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MisPendientesUITests
    dependencies:
      - target: MisPendientes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.esaupeco.mispendientes.uitests
        TEST_TARGET_NAME: MisPendientes
schemes:
  MisPendientes:
    build:
      targets:
        MisPendientes: all
    test:
      config: Debug
      targets:
        - MisPendientesTests
        - MisPendientesUITests
    archive:
      config: Release
