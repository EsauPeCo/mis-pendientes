name: Evidencia del Reto 5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar evidencia
        run: bash scripts/ci/evidencia.sh
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: evidencia/
          if-no-files-found: warn
